# Publish the site/ folder to GitHub Pages on every push to main.
name: deploy-pages

on:
  push:
    branches:
      - "main"
      - "claude-rework"
  workflow_dispatch: # allows a manual redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
